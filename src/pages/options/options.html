<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>New Tab Settings</title>
        <link rel="stylesheet" href="options.css" />
    </head>
    <body class="options">
        <script>document.body.style.backgroundColor=window.matchMedia("(prefers-color-scheme:dark)").matches?"#121212":"#f0f0f0";</script>

        <div id="notification" class="hidden"></div>

        <div id="options-wrapper">
            <div id="back">
                <span id="back-link">×</span>
            </div>
            <div class="options-sidebar">
                <h1>Settings</h1>
                <nav id="options-nav"></nav>
            </div>
            <div class="options-content">
                <div id="panel-general" class="options-panel active"></div>
                <div id="panel-shortcuts" class="options-panel"></div>
                <div id="panel-appearance" class="options-panel"></div>
                <div id="panel-sidebar" class="options-panel"></div>
                <div id="panel-keyboard" class="options-panel"></div>
                <div id="panel-backup" class="options-panel"></div>
                <div id="panel-about" class="options-panel"></div>

                <div class="button-group">
                    <div class="button-row">
                        <button id="save">Save Settings</button>
                        <button id="restore-defaults">Restore Defaults</button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="options.js"></script>
    </body>
</html>
